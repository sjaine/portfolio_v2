<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1012" width="1320" height="1012" role="img" aria-labelledby="t d">
<title id="t">How FO/RE works</title>
<desc id="d">Set once: pair the NFC card, enter work details, choose work and blocked apps with help from the Gemini and iTunes Search APIs, pick a Pomodoro preset, set after-work actions per energy level, then save and export the Apple Shortcuts. This configures the daily flow. Every day: tap the NFC card, Shortcuts turns on Focus mode and switches apps (personal apps closed, work apps opened, Pomodoro started). During work, opening a blocked app shows a friendly nudge; when a session ends a session alert appears, with one more session if work isn't done; when work time ends a time-to-finish alert appears. Planned, not yet built: tap the card again to clock out, check energy level, and get a matching rest activity, or simply rest if exhausted.</desc>
